services:

  backend:
    container_name: backend
    build:
      context: ./backend
      target: dev
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_URLS=http://+:5000 
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_WATCH_SUPPRESS_BROWSER_LAUNCH=true
      - DOTNET_USE_POLLING_FILE_WATCHER=true
    volumes:
      - ./backend:/src:z
    networks:
      - backend
    restart:
      unless-stopped

  frontend:
    container_name: frontend
    build:
      context: ./frontend
      target: dev
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app:z
      - /app/node_modules
    networks:
      - frontend
      - backend
    restart:
      unless-stopped
  
  postgres:
    image: postgres:latest
    container_name: postgres
    environment:
      - POSTGRES_USER=${USER_POSTGRES}
      - POSTGRES_PASSWORD=${PASSWORD_POSTGRES}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    restart:
      unless-stopped
  
  adminer:
    container_name: adminer
    image: adminer:latest
    ports:
      - "8080:8080"
    networks:
      - backend
    restart:
      unless-stopped

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
volumes:
  pgdata: