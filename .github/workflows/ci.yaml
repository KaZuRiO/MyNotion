name: CI Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  secret-scan:
    name: Secret Detection
    runs-on: self-hosted
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Cleanup Gitleaks Temp
        run: rm -f /tmp/gitleaks.tmp

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

  action-lint:
    name: Actions (actionlint)
    runs-on: self-hosted
    needs: secret-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1

  backend:
    name: Backend CI
    runs-on: self-hosted
    needs: secret-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup .NET
        uses: actions/setup-dotnet@baa11fbfe1d6520db94683bd5c7a3818018e4309
        env:
          DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet
        with:
          dotnet-version: "8.0.x"

      - name: Build & Test
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || github.event_name == 'pull_request'
        run: |
          dotnet restore backend/backend.sln
          dotnet build backend/backend.sln --no-restore --configuration Release
          dotnet test backend/backend.sln --no-build --configuration Release --verbosity normal

  frontend:
    name: Frontend CI
    runs-on: self-hosted
    needs: secret-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Prettier Check
        run: npx prettier --check "frontend/**/*.{ts,html,css,json,md}"

      - name: Build & Test
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || github.event_name == 'pull_request'
        run: |
          npm run build --prefix frontend
          npm run test --prefix frontend
